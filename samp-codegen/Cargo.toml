[package]
name = "samp-codegen"
version = "0.2.0"
authors = ["ZOTTCE <zottce@gmail.com>"]
description = "Codegen for samp-rs"
license = "MIT"
repository = "https://github.com/zottce/samp-rs/"
readme = "readme.md"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
